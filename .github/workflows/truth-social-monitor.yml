name: truth-social-monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes (GitHub may delay scheduled runs by a few minutes)

permissions:
  contents: write  # commit new posts to data/log/
  issues: write    # GitHub issue notifications

concurrency:
  group: truth-social-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install python packages
        run: pip install requests

      - name: check for new posts and notify
        run: python monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional settings: add any of these under Settings > Secrets and variables > Actions.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_PROXY_KEY: ${{ secrets.SCRAPE_PROXY_KEY }}
          NOTIFY_GITHUB_ISSUE: ${{ vars.NOTIFY_GITHUB_ISSUE }}
          NOTIFY_GITHUB_USER: ${{ vars.NOTIFY_GITHUB_USER }}
          GITHUB_ISSUE_KEEP_OPEN: ${{ vars.GITHUB_ISSUE_KEEP_OPEN }}
          MAX_NOTIFY: ${{ vars.MAX_NOTIFY }}
          SOURCES: ${{ vars.SOURCES }}

      - name: commit new posts
        run: |
          git add data/log
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Log new Truth Social posts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
